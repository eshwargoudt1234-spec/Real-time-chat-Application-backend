# ---------- Server ----------
# Uses the PORT given by the hosting platform, or 8082 on your computer
server.port=8081
app.cors.allowed-origins=http://localhost:8081,http://localhost:3000,http://127.0.0.1:5173

# ---------- MySQL ----------
# CHANGE username/password to your own MySQL credentials.
spring.datasource.url=jdbc:mysql://localhost:3306/chat_app_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Eshwar@1234

# ---------- JPA / Hibernate ----------
# update = create tables automatically if missing, never drop data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- JWT ----------
# Must be at least 32 characters. Change it before real deployment!
app.jwt.secret=change-this-super-secret-key-to-something-long-and-random-1234567890
app.jwt.expiration-ms=86400000

# ---------- Frontend origins allowed to call this API (CORS + WebSocket) ----------
# Comma separated. Add your deployed frontend URL here (or set env var APP_CORS_ALLOWED_ORIGINS).
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8000,http://localhost:9090
